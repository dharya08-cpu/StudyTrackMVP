name: Unpack v2
on:
  push:
    branches: [v2]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          ZIP="StudyTrackV2_MasterTested.zip"
          if [ ! -f "$ZIP" ]; then echo "No zip, nothing to do"; exit 0; fi
          mkdir /tmp/v2
          unzip -q "$ZIP" -x "*/server/studytrack.db" -d /tmp/v2
          cp -a /tmp/v2/StudyTrackV2_ProductionFixed/. .
          rm "$ZIP"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade to StudyTrack v2"
          git push origin HEAD:v2
          
